name: Aegis SOC CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-build:
    name: Next.js Quality & Build Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Lint Verification
        run: npm run lint

      - name: Production Build Compilation
        run: npm run build
        env:
          DATABASE_URL: "postgresql://mock:mock@localhost:5432/mock"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_mock"
          CLERK_SECRET_KEY: "sk_test_mock"

  backend-build-test:
    name: FastAPI Quality & Test Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python-service/requirements.txt
          pip install flake8 pytest

      - name: Backend Lint Check (Flake8)
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 python-service/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 python-service/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest Test Suite
        run: |
          cd python-service
          pytest
        env:
          DATABASE_URL: "postgresql://mock:mock@localhost:5432/mock"

  docker-image-validation:
    name: Verify Container Assembly
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-build-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Validate Next.js Dockerfile
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: aegis-nextjs-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate FastAPI Dockerfile
        uses: docker/build-push-action@v4
        with:
          context: ./python-service
          file: ./python-service/Dockerfile
          push: false
          tags: aegis-fastapi-service:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
