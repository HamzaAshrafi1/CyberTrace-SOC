services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_DB: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  chromadb:
    image: chromadb/chroma:0.6.3
    ports: ["127.0.0.1:8001:8000"]
    volumes: ["chromadb_data:/chroma/chroma"]
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
  fastapi-service:
    build: ./python-service
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql://aegis:${POSTGRES_PASSWORD}@postgres:5432/aegis
      AEGIS_SERVICE_SECRET: ${AEGIS_SERVICE_SECRET:?Set AEGIS_SERVICE_SECRET}
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes: ["fastapi_logs:/app/logs"]
    depends_on:
      postgres: {condition: service_healthy}
      chromadb: {condition: service_started}
  nextjs-frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set Clerk key}
    ports: ["127.0.0.1:3000:3000"]
    environment:
      DATABASE_URL: postgresql://aegis:${POSTGRES_PASSWORD}@postgres:5432/aegis
      REDIS_URL: redis://redis:6379
      AEGIS_SERVICE_URL: http://fastapi-service:8000
      AEGIS_SERVICE_SECRET: ${AEGIS_SERVICE_SECRET}
      AEGIS_INTERNAL_KEY: ${AEGIS_INTERNAL_KEY:?Set AEGIS_INTERNAL_KEY}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set Clerk secret}
    volumes: ["evidence_data:/app/uploads", "frontend_logs:/app/logs"]
    depends_on:
      postgres: {condition: service_healthy}
      fastapi-service: {condition: service_started}
volumes:
  postgres_data:
  chromadb_data:
  fastapi_logs:
  evidence_data:
  frontend_logs:
